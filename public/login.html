<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Poultry Management System</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link
        rel="stylesheet"
        href="login.css"
    >

</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <div class="login-icon">
                🐔
            </div>

            <h1>
                Poultry Management System
            </h1>

            <p class="subtitle">
                Smart Coop Monitoring
            </p>


            <form id="loginForm">

                <label>
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    placeholder="Enter username"
                    required
                >


                <label>
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    required
                >


                <button type="submit">
                    LOGIN
                </button>

            </form>


            <div
                id="loginError"
                class="login-error"
            ></div>

        </div>

    </div>


    <script src="login.js"></script>

</body>

</html>
